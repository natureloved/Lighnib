<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Lighnib mark">
  <title>Lighnib mark, a padlock whose keyhole is a lightning bolt</title>
  <!-- outer seal ring -->
  <circle cx="60" cy="60" r="54" fill="#0B1F14" stroke="#F2B705" stroke-width="5"/>
  <!-- shackle -->
  <path d="M42 58 V46 a18 18 0 0 1 36 0 V58" fill="none" stroke="#F2B705" stroke-width="7" stroke-linecap="round"/>
  <!-- lock body -->
  <rect x="34" y="58" width="52" height="42" rx="9" fill="#F2B705"/>
  <!-- lightning bolt keyhole -->
  <path d="M64 66 L50 80 H58 L54 92 L70 76 H62 Z" fill="#0B1F14"/>
</svg>
